# The tools the gates shell out to. The Rust toolchain stays with rustup: see
# rust-toolchain.toml.
#
# After a version bump, refresh the lockfile for every supported host:
#   mise lock --platform linux-x64,linux-arm64,macos-arm64,macos-x64
# Export GITHUB_TOKEN first. Without one the GitHub API rate limit is soon
# spent, and `mise lock` then warns, skips the platforms it could not look up,
# and still exits 0. An xtask test fails while a tool lacks one of the four.

# The floor for `mise lock --platform` and the lockfile format in mise.lock.
min_version = "2026.9.0"

[tools]
# `cargo xtask deny` (pre-push, CI).
cargo-deny = "0.20.2"

# `cargo xtask coverage` (CI). From the GitHub release, which has a binary for
# every supported host and a checksum mise.lock can record.
"github:taiki-e/cargo-llvm-cov" = "0.9.1"

# `cargo xtask mutants` (CI). Compiled from source (see cargo.binstall below):
# upstream publishes no arm64 macOS binary, and the x86_64 one binstall falls
# back to cannot link under Rosetta.
"cargo:cargo-mutants" = "27.1.0"

# `cargo xtask weaver ...` (pre-commit, CI). From the GitHub release: the ubi
# backend records no checksum.
"github:open-telemetry/weaver" = "0.26.1"

# `cargo xtask fmt` (pre-commit): JSON, TOML, Markdown, and YAML.
dprint = "0.57.4"

# `cargo xtask lint-prose` (pre-commit).
vale = "3.22.0"

[settings]
lockfile = true
# Only cargo-mutants uses the cargo backend, and its prebuilt binary is the
# wrong architecture on arm64 macOS.
cargo.binstall = false
