# The tools the gates shell out to, pinned to exact versions. `mise install`
# puts them in mise's own directories; nothing is installed system-wide. The
# Rust toolchain stays with rustup: see rust-toolchain.toml.
#
# A version bump here is its own commit, like a crate bump (spec §8). After a
# bump, refresh the lockfile for every supported host:
#   mise lock --platform linux-x64,linux-arm64,macos-arm64,macos-x64

# The floor for `mise lock --platform` and the lockfile format in mise.lock;
# the same floor UsefulBytes uses for the same backends. This file was written
# and verified with mise 2026.9.7, which is also the version CI pins in
# .github/workflows/ci.yml.
min_version = "2026.9.0"

[tools]
# `cargo xtask deny` (pre-push, CI): licences, advisories, bans, sources,
# configured in lablet/deny.toml.
cargo-deny = "0.20.2"

# `cargo xtask coverage` (CI): line coverage floor on the domain and
# application crates. Needs the llvm-tools-preview component from
# rust-toolchain.toml. Taken from the GitHub release, which has a binary for
# every supported host and a checksum mise.lock can record.
"github:taiki-e/cargo-llvm-cov" = "0.9.1"

# `cargo xtask mutants` (CI): mutation floor on the same crates. Compiled from
# source (see cargo.binstall below): upstream publishes no arm64 macOS binary,
# and the x86_64 one binstall falls back to cannot link under Rosetta, so the
# unmutated baseline build fails on Apple silicon.
"cargo:cargo-mutants" = "27.1.0"

# `cargo xtask weaver ...` (pre-commit from phase 1, live-check in CI from
# phase 6): the telemetry registry check, code generation, and live-check.
# From the GitHub release; the ubi backend the Weaver research used is
# deprecated and removed in mise 2027.1.0, and records no checksum.
"github:open-telemetry/weaver" = "0.26.1"

[settings]
lockfile = true
# cargo: tools are compiled from source. Only cargo-mutants uses the cargo
# backend, and its prebuilt binary is the wrong architecture on arm64 macOS.
cargo.binstall = false
