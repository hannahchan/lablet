[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Lablet's gate runner: cargo xtask <task>"

# Its own workspace, not a member of lablet/: building the gates never touches
# the product's lockfile, and the product never inherits a gate dependency.
[workspace]

[dependencies]
# Reads Cargo manifests for the lints and the floor checks
toml = "=1.1.6"
# Typed views of the manifest tables and tool reports
serde = { version = "=1.0.229", features = ["derive"] }
# Reads the JSON reports of cargo-llvm-cov and cargo-mutants
serde_json = "=1.0.151"

# xtask cannot inherit `[workspace.lints]` from lablet/Cargo.toml, so this is a
# copy; `cargo xtask lint-manifests` holds the two in step.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
redundant_explicit_links = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

dbg_macro = "warn"
# Printing is what xtask does, so these two differ from the workspace.
print_stdout = "allow"
print_stderr = "allow"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
expect_used = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
