# Loosening this policy (a new licence, an ignored advisory, a skipped
# duplicate) needs a comment saying which crate needs it and when to revisit.

[graph]
# Windows is not supported, so Windows-only dependencies are not checked. musl
# is the release binary.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]
all-features = true

[advisories]
unmaintained = "all"
unsound = "all"
yanked = "deny"
# An entry needs the advisory id, why lablet is not affected, and what upgrade
# removes it.
ignore = []

[licenses]
# Lablet is MIT OR Apache-2.0, so every dependency must be usable under both.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  # Absent until a dependency needs them: MPL-2.0, CDLA-Permissive-2.0,
  # OpenSSL. Copyleft licences (GPL, LGPL, AGPL) are never added.
]
confidence-threshold = 0.8
# The allow-list is policy, not an inventory: an unused entry is not a finding.
unused-allowed-license = "allow"

[bans]
# Upstream crates decide most duplicates, so they are reported, not failed.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
  # The static musl build must need no system libraries. If one of these
  # appears, turn off a dependency's default TLS feature in
  # [workspace.dependencies].
  { crate = "openssl", reason = "lablet is rustls-only (spec §6)" },
  { crate = "openssl-sys", reason = "lablet is rustls-only (spec §6)" },
  { crate = "native-tls", reason = "lablet is rustls-only (spec §6)" },
  # A ban covers the whole graph. If an upstream crate uses one of these
  # inside, keep the ban and list that crate under `wrappers`, with a comment
  # naming what pulls it in.
  { crate = "anyhow", reason = "errors are thiserror enums, one per port or boundary (contributing)" },
  { crate = "eyre", reason = "errors are thiserror enums, one per port or boundary (contributing)" },
  { crate = "color-eyre", reason = "errors are thiserror enums, one per port or boundary (contributing)" },
  { crate = "mockall", reason = "test doubles are hand-written fakes; no mocking framework (contributing)" },
  { crate = "mockall_double", reason = "test doubles are hand-written fakes; no mocking framework (contributing)" },
  { crate = "mockiato", reason = "test doubles are hand-written fakes; no mocking framework (contributing)" },
  { crate = "mocktopus", reason = "test doubles are hand-written fakes; no mocking framework (contributing)" },
  { crate = "faux", reason = "test doubles are hand-written fakes; no mocking framework (contributing)" },
  { crate = "unimock", reason = "test doubles are hand-written fakes; no mocking framework (contributing)" },
  { crate = "mry", reason = "test doubles are hand-written fakes; no mocking framework (contributing)" },
  { crate = "double", reason = "test doubles are hand-written fakes; no mocking framework (contributing)" },
]
# An entry needs the crate, the version, and which upstream pulls the duplicate.
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
