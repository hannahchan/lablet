[workspace]
resolver = "3"
members = [
  "apps/lablet",
  "crates/domain/model",
  "crates/domain/policy",
  "crates/application/run",
  "crates/adapters/secondary/provider-anthropic",
  "crates/adapters/secondary/provider-openai",
  "crates/adapters/secondary/provider-fake",
  "crates/adapters/secondary/tools-builtin",
  "crates/adapters/secondary/tools-mcp",
  "crates/adapters/secondary/telemetry-otel",
  "crates/adapters/secondary/shared/telemetry-registry",
  "tests/conformance",
  "tests/mcp-server",
]

# rust-version is the MSRV: the rust-toolchain.toml pin minus two minor versions.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hannahchan/lablet"

# Features are additive, so a member cannot narrow a list below: each list is
# the base every user of the crate needs, and a member that needs more adds it.
[workspace.dependencies]
# Internal

# Domain: conversation, tools, usage, stop reasons, run identity, summary
lablet-model = { path = "crates/domain/model", version = "0.1.0" }
# Domain: pure stop and retry decisions, pricing
lablet-policy = { path = "crates/domain/policy", version = "0.1.0" }
# Application: RunService (the loop) and its secondary ports
lablet-run = { path = "crates/application/run", version = "0.1.0" }
# Adapter: ModelProvider over the Anthropic Messages API
lablet-provider-anthropic = { path = "crates/adapters/secondary/provider-anthropic", version = "0.1.0" }
# Adapter: ModelProvider over OpenAI-compatible chat completions
lablet-provider-openai = { path = "crates/adapters/secondary/provider-openai", version = "0.1.0" }
# Adapter: ModelProvider that plays scripted responses
lablet-provider-fake = { path = "crates/adapters/secondary/provider-fake", version = "0.1.0" }
# Adapter: ToolExecutor for bash, read_file, write_file
lablet-tools-builtin = { path = "crates/adapters/secondary/tools-builtin", version = "0.1.0" }
# Adapter: ToolExecutor over rmcp
lablet-tools-mcp = { path = "crates/adapters/secondary/tools-mcp", version = "0.1.0" }
# Adapter: RunObserver mapping events to OTel spans and logs
lablet-telemetry-otel = { path = "crates/adapters/secondary/telemetry-otel", version = "0.1.0" }
# Adapter shared kernel: generated attribute name constants and enums
lablet-telemetry-registry = { path = "crates/adapters/secondary/shared/telemetry-registry", version = "0.1.0" }
# Composition root: config, build(), and the library surface
lablet = { path = "apps/lablet", version = "0.1.0" }
# Test support: shared ToolExecutor and RunObserver case sets
lablet-conformance = { path = "tests/conformance", version = "0.1.0" }

# Ports and errors

# Async fn in the port traits, which must stay dyn-compatible.
async-trait = "=0.1.92"
# One error enum per port or boundary.
thiserror = "=2.0.20"

# Serialisation

# Derives on the domain model and config types.
serde = { version = "=1.0.229", features = ["derive"] }
# Transcript, tool inputs, OTLP/JSON file lines, and the config tree that --set edits.
serde_json = "=1.0.151"
# YAML config and fake-provider scripts; serde_yaml is archived.
serde-saphyr = "=1.3.0"

# Async runtime

# Runtime for the loop, child-process MCP servers, the bash tool, Ctrl-C, and test receivers.
tokio = { version = "=1.53.1", features = [
  "rt-multi-thread",
  "macros",
  "time",
  "sync",
  "process",
  "io-util",
  "io-std",
  "fs",
  "signal",
  "net",
] }

# HTTP and MCP

# HTTP client for the provider adapters; rmcp and the OTLP exporter share it.
# Default features are off so the TLS stack is chosen here: rustls, never native-tls.
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "http2"] }
# MCP SDK: the client role over stdio child processes and streamable HTTP on reqwest.
rmcp = { version = "=3.4.0", default-features = false, features = [
  "client",
  "transport-child-process",
  "transport-streamable-http-client-reqwest",
  "reqwest",
] }

# OpenTelemetry

# Span and log record API for telemetry-otel. `internal-logs`, here and below, sends
# SDK export failures to `tracing`; without it the batch threads drop them.
opentelemetry = { version = "=0.33.0", default-features = false, features = [
  "trace",
  "logs",
  "internal-logs",
] }
# Providers, batch processors, and the exporter traits the file exporter implements.
opentelemetry_sdk = { version = "=0.33.0", default-features = false, features = [
  "trace",
  "logs",
  "internal-logs",
] }
# OTLP message types with serde, for the OTLP/JSON file exporter and its reader.
opentelemetry-proto = { version = "=0.33.0", default-features = false, features = [
  "gen-tonic-messages",
  "trace",
  "logs",
  "with-serde",
] }
# OTLP network exporter over gRPC and HTTP/protobuf, on rustls.
opentelemetry-otlp = { version = "=0.33.0", default-features = false, features = [
  "grpc-tonic",
  "http-proto",
  "reqwest-blocking-client",
  "reqwest-rustls",
  "tls-aws-lc",
  "tls-roots",
  "trace",
  "logs",
  "internal-logs",
] }
# Protobuf bodies in the in-process OTLP HTTP receiver; the line opentelemetry-proto requires.
prost = "=0.14.4"
# In-process OTLP gRPC receiver in lablet-conformance; the line opentelemetry-otlp requires.
tonic = { version = "=0.14.6", default-features = false, features = ["server", "router"] }
# In-process OTLP HTTP receiver in lablet-conformance; the line tonic's router uses, so one copy.
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }

# Diagnostics (not the telemetry contract)

# Diagnostic logging inside adapters and the app.
tracing = "=0.1.44"
# The CLI's stderr diagnostic log, with level filtering.
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

# CLI and config

# The init, run, check, and schema commands.
clap = { version = "=4.6.7", features = ["derive"] }
# Parses and prints config durations.
humantime = "=2.4.0"
# RunId generation in the composition root.
ulid = "=3.0.0"
# Digest of the resolved config.
sha2 = "=0.11.0"
# JSON Schema for the config (`lablet schema`); the line rmcp and opentelemetry-proto accept.
schemars = "=1.2.2"

# Dev-only

# Provider adapter tests against recorded HTTP payloads.
wiremock = "=0.6.5"
# Benchmarks behind `cargo xtask bench`. Default features are off to avoid plotters and rayon.
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }
# Property tests for the laws the domain's aggregation depends on, which examples can't state:
# that cost is additive over consistent usages, and that usage sums are a monoid. Default
# features are off to drop the fork-based test runner and its `rusty-fork` and `tempfile` trees;
# lablet's properties are pure and need no process isolation.
proptest = { version = "=1.11.0", default-features = false, features = ["std", "bit-set"] }

# Levels are "warn" so plain `cargo check` stays usable mid-edit; the clippy gate denies
# warnings. xtask/Cargo.toml carries a copy, held in step by `cargo xtask lint-manifests`.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
redundant_explicit_links = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
expect_used = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

# Line tables keep backtraces into our own code readable without full DWARF.
[profile.dev]
debug = "line-tables-only"

# Dependencies only; "*" does not match workspace members. Debug info is most of a
# dependency rlib, and opt-level 1 shrinks test binaries and their link time.
[profile.dev.package."*"]
opt-level = 1
debug = false
debug-assertions = false
strip = "debuginfo"
incremental = false
