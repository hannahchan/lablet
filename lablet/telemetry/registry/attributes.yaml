file_format: definition/2

# Every attribute lablet owns. A core or GenAI attribute is used wherever one
# exists, so each entry's note opens with why none does; the justification
# policy fails an entry without one.
attributes:
  # Identity and setup
  - key: lablet.config.digest
    type: string
    stability: development
    brief: SHA-256 of the resolved config, in hex.
    note: >
      Justification: no convention identifies the configuration that produced a run, and grouping
      runs by configuration is what lablet's measurements are for.
    examples: ["9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"]
  - key: lablet.task.id
    type: string
    stability: development
    brief: The task the run attempts, as the run request named it.
    note: >
      Justification: the conventions identify a conversation and an agent, not the task a run
      was given. A composer runs one task many times and under many configs, and groups runs by
      it more than by anything else, so it's declared here rather than left to a resource
      attribute whose key the registry can't know.
    examples: ["fix-failing-test", "swe-bench/django-11099"]
  - key: lablet.experiment.id
    type: string
    stability: development
    brief: The experiment the run is part of, as the run request named it.
    note: >
      Justification: no convention names the comparison a run belongs to. It's what tells the
      runs of one comparison from the runs of another that attempt the same task.
    examples: ["tool-descriptions-v2"]
  - key: lablet.trial
    type: string
    stability: development
    brief: Which repetition of the task the run is, as the run request named it.
    note: >
      Justification: no convention numbers the repetitions of a task. A string, because the
      composer chooses it and lablet gives it no meaning of its own.
    examples: ["1", "seed-42"]
  - key: lablet.tools.digest
    type: string
    stability: development
    brief: SHA-256 of the tool specs as the run offered them, in hex.
    note: >
      Justification: `gen_ai.tool.definitions` is opt-in content, and `lablet.config.digest`
      can't see a tool's description, which a server supplies. The digest tells two runs apart
      that were offered different tools under one config. It's taken from each spec as compact
      JSON in lablet's own form, in the order offered, with nothing between them.
    examples: ["4bf5122f344554c53bde2ebb8cd2b7e3d1600ad631c385a5d7cce23c7785459a"]
  - key: lablet.prompt.system_digest
    type: string
    stability: development
    brief: SHA-256 of the system prompt as it was sent, in hex.
    note: >
      Justification: `gen_ai.system_instructions` is opt-in content, and
      `lablet.config.digest` covers the path of a prompt file, not its text. The digest tells
      two runs apart whose prompts differ under one config.
    examples: ["dbc1b4c900ffe48d575b5da5c638040125f65db0fe3e24494b76ea986457d986"]
  - key: lablet.run.completion_mode
    type:
      members:
        - id: natural
          value: natural
          brief: The run completes when the model returns a turn with no tool calls.
          stability: development
        - id: explicit
          value: explicit
          brief: The run completes when the model calls `task_complete`.
          stability: development
    stability: development
    brief: How the run decides that the model has finished.
    note: >
      Justification: the completion mode is a property of lablet's loop; the GenAI conventions
      don't describe how an agent decides that it's done.
    examples: [natural, explicit]
  - key: lablet.run.max_turns
    type: int
    stability: development
    brief: The configured cap on turns.
    note: >
      Justification: the GenAI conventions carry request parameters of one inference call, not
      the budgets of an agent loop.
    examples: [30]
  - key: lablet.run.timeout_ms
    type: int
    stability: development
    brief: The configured run timeout, in milliseconds.
    note: >
      Justification: the GenAI conventions carry request parameters of one inference call, not
      the budgets of an agent loop.
    examples: [600000]
  - key: lablet.tools.names
    type: string[]
    stability: development
    brief: Names of the tools offered to the model, after the allow and deny lists.
    note: >
      Justification: `gen_ai.tool.definitions` holds full definitions and is opt-in content; the
      names alone are needed on every run to compare tool sets.
    examples: [["bash", "read_file", "write_file"]]
  - key: lablet.tools.count
    type: int
    stability: development
    brief: Number of tools offered to the model.
    note: >
      Justification: no convention counts the tools offered, and an array's length can't be
      aggregated in most backends.
    examples: [3]
  - key: lablet.mcp.servers
    type: string[]
    stability: development
    brief: Names of the configured MCP servers.
    note: >
      Justification: the `mcp.*` conventions describe one MCP call; none lists the servers an
      agent was configured with.
    examples: [["docs", "search"]]
  - key: lablet.mcp.server_versions
    type: string[]
    stability: development
    brief: The version each MCP server gave of itself when it started, in the order of `lablet.mcp.servers`.
    note: >
      Justification: the `mcp.*` conventions describe one MCP call and carry the protocol's
      version, not the server's. Two builds of a server started by one command offer different
      tools under one config, and the version is what says which build a run had.
    examples: [["1.4.0", "0.9.2"]]
  - key: lablet.mcp.lifetime
    type:
      members:
        - id: run
          value: run
          brief: The servers are started again for each run.
          stability: development
        - id: lablet
          value: lablet
          brief: The servers are started once and serve every run of their `Lablet`.
          stability: development
    stability: development
    brief: How long the run's MCP servers live.
    note: >
      Justification: no convention says whether a server outlived the run that used it. A
      server that does carries what one run left in it to the next, so two runs are comparable
      only when the record says which they had.
    examples: [run, lablet]
  - key: lablet.prompt.system_bytes
    type: int
    stability: development
    brief: Size of the system prompt in bytes, skills included.
    note: >
      Justification: `gen_ai.system_instructions` is opt-in content; the size is needed when
      content isn't captured, and no convention carries it.
    examples: [2048]
  - key: lablet.prompt.user_bytes
    type: int
    stability: development
    brief: Size of the task prompt in bytes.
    note: >
      Justification: `gen_ai.input.messages` is opt-in content; the size is needed when content
      isn't captured, and no convention carries it.
    examples: [512]
  - key: lablet.prompt.tools_bytes
    type: int
    stability: development
    brief: Size of the tool specs in bytes, as the run offered them.
    note: >
      Justification: `gen_ai.tool.definitions` is opt-in content; the size is needed when
      content isn't captured, and no convention carries it. It's the size of the bytes
      `lablet.tools.digest` is taken from, and a part of every `lablet.request.bytes`.
    examples: [3120]
  - key: lablet.skills.count
    type: int
    stability: development
    brief: Number of skill files appended to the system prompt.
    note: >
      Justification: skills are a lablet config feature with no counterpart in the conventions.
    examples: [2]

  # Outcome
  - key: lablet.run.stop_reason
    type:
      members:
        - id: completed
          value: completed
          brief: The model finished, by a turn with no tool calls or by calling `task_complete`.
          stability: development
        - id: ended_without_completion
          value: ended_without_completion
          brief: In explicit mode, the model returned a turn with no tool calls and never called `task_complete`.
          stability: development
        - id: max_turns
          value: max_turns
          brief: The run reached `run.max_turns`.
          stability: development
        - id: timeout
          value: timeout
          brief: The run reached `run.timeout`.
          stability: development
        - id: max_total_tokens
          value: max_total_tokens
          brief: Input plus output tokens reached `run.max_total_tokens`.
          stability: development
        - id: output_truncated
          value: output_truncated
          brief: The last response hit the output token limit. Its tool calls, if any, weren't executed.
          stability: development
        - id: context_exhausted
          value: context_exhausted
          brief: The conversation outgrew the model's context. The provider rejected the request as too long, or cut the response short at the window.
          stability: development
        - id: retries_exhausted
          value: retries_exhausted
          brief: One provider call failed on every attempt `run.max_retries` allows.
          stability: development
        - id: invalid_calls_exhausted
          value: invalid_calls_exhausted
          brief: "`run.max_consecutive_invalid_turns` turns in a row made no call that reached a tool."
          stability: development
        - id: cancelled
          value: cancelled
          brief: The run was cancelled.
          stability: development
        - id: provider_error
          value: provider_error
          brief: The provider returned an error that isn't retryable.
          stability: development
        - id: refused
          value: refused
          brief: The model declined to answer, or a content filter withheld the response.
          stability: development
    stability: development
    brief: Why the run ended.
    note: >
      Justification: `gen_ai.response.finish_reasons` describes one inference call and can't
      express a budget, a timeout, or a cancellation; the conventions have no per-run outcome.
    examples: [completed, max_turns]
  - key: lablet.run.error
    type: string
    stability: development
    brief: The message of the error that ended the run.
    note: >
      Justification: `error.type` is a low-cardinality class and `error.message` is deprecated;
      `exception.message` belongs to an exception record, not to a run summary.
    examples: ["provider: 401 invalid x-api-key"]
  - key: lablet.run.duration_ms
    type: int
    stability: development
    brief: Wall-clock duration of the run, in milliseconds.
    note: >
      Justification: a span has a duration but a log record has none, and the wide event must be
      readable without joining the root span.
    examples: [12345]
  - key: lablet.run.turns
    type: int
    stability: development
    brief: Number of turns the run took.
    note: >
      Justification: a turn is the loop's own unit, one provider response and its tool calls; the
      conventions count inference calls, which also include retries.
    examples: [7]
  - key: lablet.result.text_bytes
    type: int
    stability: development
    brief: Size of the final assistant text in bytes.
    note: >
      Justification: `gen_ai.output.messages` is opt-in content; the size is needed when content
      isn't captured, and no convention carries it.
    examples: [834]
  - key: lablet.result.has_structured
    type: boolean
    stability: development
    brief: Whether the run produced a structured result, the `task_complete` argument.
    note: >
      Justification: the structured result is a product of lablet's explicit completion mode,
      which the conventions don't describe.
    examples: [true]
  - key: lablet.run.transcript_path
    type: string
    stability: development
    brief: Where the run's transcript is written.
    note: >
      Justification: `file.path` describes a file an operation acts on; this points from the
      telemetry to a separate artefact of the run, which no convention does.
    examples: ["runs/01J9Z3/transcript.json"]
  - key: lablet.run.cost_usd
    type: double
    stability: development
    brief: Cost of the run in US dollars, from the configured pricing.
    note: >
      Justification: the GenAI conventions report token counts only and define no cost attribute.
    examples: [0.0421]
  - key: lablet.telemetry.dropped_records
    type: int
    stability: development
    brief: Number of spans and log records of the run that lablet's exporters refused or dropped before the wide event was made.
    note: >
      Justification: the conventions count what an SDK drops as metrics of the SDK, which a
      consumer of one run's record doesn't have. The count is on the run's one row so that a
      row whose spans or content are incomplete says so. The wide event is made once the
      run's other records have been flushed, and it isn't counted itself.
    examples: [0]

  # Provider totals
  - key: lablet.provider.retries
    type: int
    stability: development
    brief: Number of provider call attempts made beyond the first of their call.
    note: >
      Justification: no convention counts repeated inference attempts across an agent run. A call
      that fails on its only attempt adds none.
    examples: [1]
  - key: lablet.provider.latency_ms.total
    type: int
    stability: development
    brief: Sum of the latencies of every provider call attempt, in milliseconds.
    note: >
      Justification: the conventions record one operation's duration as a span or a histogram; a
      per-run sum has no attribute.
    examples: [41200]
  - key: lablet.provider.latency_ms.max
    type: int
    stability: development
    brief: Latency of the slowest provider call attempt, in milliseconds.
    note: >
      Justification: the conventions record one operation's duration as a span or a histogram; a
      per-run maximum has no attribute.
    examples: [9800]
  - key: lablet.provider.failed.input_tokens
    type: int
    stability: development
    brief: Input tokens that failed provider call attempts reported, summed, cached tokens included.
    note: >
      Justification: `gen_ai.usage.input_tokens` on the wide event sums the calls that
      succeeded, as the outcome does, and no convention counts what a failed call used. A
      provider can bill an attempt it didn't finish, so these count toward the cost and the
      token budget, and a run that fails more often would otherwise look cheaper than it was.
    examples: [1200]
  - key: lablet.provider.failed.output_tokens
    type: int
    stability: development
    brief: Output tokens that failed provider call attempts reported, summed.
    note: >
      Justification: as `lablet.provider.failed.input_tokens`.
    examples: [48]
  - key: lablet.provider.failed.cache_read.input_tokens
    type: int
    stability: development
    brief: The part of `lablet.provider.failed.input_tokens` served from the provider's prompt cache.
    note: >
      Justification: as `lablet.provider.failed.input_tokens`. The cost prices cached tokens
      at their own rates, so it can't be worked out again without the cache counts.
    examples: [1000]
  - key: lablet.provider.failed.cache_write.input_tokens
    type: int
    stability: development
    brief: The part of `lablet.provider.failed.input_tokens` written to the provider's prompt cache.
    note: >
      Justification: as `lablet.provider.failed.cache_read.input_tokens`.
    examples: [200]

  # Tool totals
  - key: lablet.tool_calls.total
    type: int
    stability: development
    brief: Number of tool calls executed. The intercepted `task_complete` call isn't one, and neither is a call that was never run.
    note: >
      Justification: no convention counts the tool calls of an agent run.
    examples: [5]
  - key: lablet.tool_calls.errors
    type: int
    stability: development
    brief: Number of tool calls that returned an error result.
    note: >
      Justification: no convention counts the failed tool calls of an agent run.
    examples: [1]
  - key: lablet.tool_calls.unknown
    type: int
    stability: development
    brief: Number of tool calls that named a tool the run didn't offer.
    note: >
      Justification: the model can call any name, so these calls get no per-tool attribute and
      would otherwise be invisible in the per-tool breakdown; no convention counts them.
    examples: [0]
  - key: lablet.tool_calls.truncated
    type: int
    stability: development
    brief: Number of tool calls whose output the output cap cut short.
    note: >
      Justification: no convention says that a tool's output was cut before the model saw it, per
      call or per run; the count tells a run whose tools outgrew the cap from one they fitted.
    examples: [0]
  - key: lablet.tool_calls.latency_ms.total
    type: int
    stability: development
    brief: Sum of the latencies of every tool call, in milliseconds.
    note: >
      Justification: the conventions record one tool call's duration as a span; a per-run sum has
      no attribute.
    examples: [3100]
  - key: lablet.tool_calls.input_bytes.total
    type: int
    stability: development
    brief: Sum of the sizes of every tool call's input, in bytes.
    note: >
      Justification: `gen_ai.tool.call.arguments` is opt-in content; no convention carries its
      size, per call or per run.
    examples: [1820]
  - key: lablet.tool_calls.output_bytes.total
    type: int
    stability: development
    brief: Sum of the sizes of every tool call's output, in bytes.
    note: >
      Justification: `gen_ai.tool.call.result` is opt-in content; no convention carries its size,
      per call or per run.
    examples: [56012]
  - key: lablet.tool.calls
    type: template[int]
    stability: development
    brief: Number of calls to one tool, `<key>` being the tool name.
    note: >
      Justification: per-tool counts on the run's one row answer which tool dominated without a
      join; the conventions have no per-tool aggregate, and a template is the only dynamic key
      Weaver allows.
    examples: [[3]]
  - key: lablet.tool.errors
    type: template[int]
    stability: development
    brief: Number of error results from one tool, `<key>` being the tool name.
    note: >
      Justification: per-tool error counts on the run's one row; the conventions have no per-tool
      aggregate.
    examples: [[1]]
  - key: lablet.tool.latency_ms
    type: template[int]
    stability: development
    brief: Sum of the latencies of the calls to one tool, in milliseconds, `<key>` being the tool name.
    note: >
      Justification: per-tool latency on the run's one row; the conventions have no per-tool
      aggregate.
    examples: [[2100]]

  # Content, captured only on request
  - key: lablet.result.text
    type: string
    stability: development
    brief: The final assistant text.
    note: >
      Justification: `gen_ai.output.messages` holds every message of one inference call in a
      structured form; the run's result is one string on the run's one row.
    examples: ["The function returns early when the list is empty."]
  - key: lablet.result.structured
    type: string
    stability: development
    brief: The structured result, the `task_complete` argument, as a JSON string.
    note: >
      Justification: the structured result is a product of lablet's explicit completion mode,
      which the conventions don't describe.
    examples: ['{"answer": 42}']

  # Per-step
  - key: lablet.turn
    type: int
    stability: development
    brief: One-based index of the turn a provider call or tool call belongs to.
    note: >
      Justification: the conventions have no turn; the index groups a turn's chat and tool spans
      without adding a span level.
    examples: [1, 2]
  - key: lablet.attempt
    type: int
    stability: development
    brief: One-based attempt number of a provider call within its turn.
    note: >
      Justification: `http.request.resend_count` counts resends of one HTTP request inside a
      client; lablet's retry is a new inference call with a span of its own.
    examples: [1, 2]
  - key: lablet.chat.purpose
    type:
      members:
        - id: turn
          value: turn
          brief: The call asks the model for the next turn of the conversation.
          stability: development
    stability: development
    brief: What a provider call is for.
    note: >
      Justification: `gen_ai.operation.name` is `chat` for every call to a chat model, whatever
      the agent wanted of it. A consumer that counts chat spans as turns filters on this, and
      stays right when lablet makes a provider call that isn't a turn, such as one that
      summarises the conversation.
    examples: [turn]
  - key: lablet.request.bytes
    type: int
    stability: development
    brief: Size in bytes of the system prompt, messages, and tool specs sent in a provider call.
    note: >
      Justification: `http.request.body.size` measures a wire body only an HTTP client sees; this
      is the loop's provider-independent measure of context growth. The loop measures it: the
      length of the system prompt plus the length of each message and each tool spec as compact
      JSON in lablet's own form.
    examples: [48211]
  - key: lablet.tool.source
    type:
      members:
        - id: builtin
          value: builtin
          brief: One of lablet's built-in tools.
          stability: development
        - id: mcp
          value: mcp
          brief: A tool served by a configured MCP server.
          stability: development
    stability: development
    brief: Where a tool comes from.
    note: >
      Justification: `gen_ai.tool.type` says how a tool is invoked (function, extension,
      datastore), not which executor serves it.
    examples: [builtin, mcp]
  - key: lablet.tool.status
    type:
      members:
        - id: ok
          value: ok
          brief: The tool ran and returned a result.
          stability: development
        - id: tool_error
          value: tool_error
          brief: The tool ran and reported an error in its own result.
          stability: development
        - id: unknown
          value: unknown
          brief: No configured tool has the name the model called.
          stability: development
        - id: malformed_input
          value: malformed_input
          brief: The model's arguments for the call weren't valid JSON, so nothing ran.
          stability: development
        - id: rejected
          value: rejected
          brief: The loop declined a `task_complete` call that wasn't the response's only call, so nothing ran.
          stability: development
        - id: not_run
          value: not_run
          brief: The call's turn came when the run had no time left, so nothing was started for it. No span carries it.
          stability: development
        - id: timeout
          value: timeout
          brief: The call ran past its deadline, the shorter of its executor's own limit and the time the run had left.
          stability: development
        - id: failed
          value: failed
          brief: The executor failed before the tool could answer.
          stability: development
    stability: development
    brief: How a tool call ended.
    note: >
      Justification: `error.type` is an open set, so it can't hold lablet's closed one, and a
      call that ended `ok` has no `error.type` at all. Every value but `ok` and `not_run` is
      also the call's `error.type`. A call that was never run has no span, so no span carries
      `not_run`. It's the status the run's transcript gives such a call, and it's a member
      here so that the transcript's statuses and this attribute's values stay one set.
    examples: [ok, tool_error]
  - key: lablet.tool.input.bytes
    type: int
    stability: development
    brief: Size of a tool call's input in bytes.
    note: >
      Justification: `gen_ai.tool.call.arguments` is opt-in content; the size is needed when
      content isn't captured, and no convention carries it.
    examples: [96]
  - key: lablet.tool.output.bytes
    type: int
    stability: development
    brief: Size in bytes of a tool call's output as the model was sent it, after the output cap.
    note: >
      Justification: `gen_ai.tool.call.result` is opt-in content; the size is needed when content
      isn't captured, and no convention carries it.
    examples: [20480]
  - key: lablet.tool.output.truncated
    type: boolean
    stability: development
    brief: Whether the output cap cut the tool call's output short.
    note: >
      Justification: no convention says that a tool's output was cut before the model saw it, and
      `lablet.tool.output.bytes` alone can't tell a cut output from one that fitted.
    examples: [false]
  - key: lablet.tool.output.original_bytes
    type: int
    stability: development
    brief: Size in bytes of a tool call's output before the output cap cut it.
    note: >
      Justification: once an output is cut, `lablet.tool.output.bytes` is the size sent, and no
      convention carries the size the tool produced.
    examples: [5242880]
  - key: lablet.tool.is_error
    type: boolean
    stability: development
    brief: Whether the tool call returned an error result to the model.
    note: >
      Justification: the model gets an error result both when the executor fails and when a tool
      reports an error in its own result; `error.type` classifies a failure, and no convention
      carries the flag.
    examples: [false]
  - key: lablet.retry.will_retry
    type: boolean
    stability: development
    brief: Whether the loop decided to retry the failed provider call.
    note: >
      Justification: the conventions have no attribute for a retry decision. The decision is
      made when the attempt fails; a run cancelled during the backoff ends before the retry, and
      its root span's stop reason says so.
    examples: [true]
  - key: lablet.retry.backoff_ms
    type: int
    stability: development
    brief: How long the loop waits before the next attempt, in milliseconds.
    note: >
      Justification: the conventions have no attribute for a retry delay.
    examples: [2000]
  - key: lablet.pricing.input_usd_per_mtok
    type: double
    stability: development
    brief: The price of a million uncached input tokens, in US dollars.
    note: >
      Justification: the conventions carry no prices. A run reports the rates it was priced at
      beside `lablet.run.cost_usd`, so a consumer can recompute the cost rather than trust it,
      and can tell a run whose provider reported cache counts above its own input count.
    examples: [3.0]
  - key: lablet.pricing.output_usd_per_mtok
    type: double
    stability: development
    brief: The price of a million output tokens, in US dollars. Reasoning tokens bill at this rate.
    note: >
      Justification: as `lablet.pricing.input_usd_per_mtok`.
    examples: [15.0]
  - key: lablet.pricing.cache_read_usd_per_mtok
    type: double
    stability: development
    brief: The price of a million input tokens served from the prompt cache, in US dollars.
    note: >
      Justification: as `lablet.pricing.input_usd_per_mtok`.
    examples: [0.3]
  - key: lablet.pricing.cache_write_usd_per_mtok
    type: double
    stability: development
    brief: The price of a million input tokens written to the prompt cache, in US dollars.
    note: >
      Justification: as `lablet.pricing.input_usd_per_mtok`.
    examples: [3.75]
  - key: lablet.request.thinking
    type: string
    stability: development
    brief: How the model was asked to reason, as the config spells it.
    note: >
      Justification: `gen_ai.request.reasoning.level` carries the effort level and nothing carries
      the thinking mode or its token budget, which is the setting a run is most often varied by.
      Written `provider_default`, `adaptive`, `adaptive:summarized`, `budget:2048`,
      `budget:2048:summarized`, or `disabled`.
    examples: ["adaptive:summarized", "budget:2048"]
  - key: lablet.request.api
    type:
      members:
        - id: messages
          value: messages
          brief: Anthropic's Messages API.
          stability: development
        - id: responses
          value: responses
          brief: OpenAI's Responses API.
          stability: development
        - id: chat_completions
          value: chat_completions
          brief: OpenAI's chat completions, and every server that speaks them.
          stability: development
        - id: script
          value: script
          brief: The scripted provider's script.
          stability: development
    stability: development
    brief: The API the run reached its model through.
    note: >
      Justification: `openai.api.type` names two APIs of one provider, and
      `gen_ai.provider.name` says `openai` for both. One attribute has to say it for every
      provider, because two runs that reach one model through different APIs don't hand it
      the same conversation after the first call.
    examples: [messages, responses]
  - key: lablet.request.reasoning_replayed
    type: boolean
    stability: development
    brief: Whether the reasoning of earlier responses was sent back on later calls.
    note: >
      Justification: no convention says what a client sends back of a model's reasoning. A
      model that isn't sent its reasoning reasons again on every turn, so two runs that differ
      in it differ in tokens and in behaviour under one model name.
    examples: [true]
  - key: lablet.request.cache_scope
    type:
      members:
        - id: shared
          value: shared
          brief: Every run that sends the same prefix shares what the provider caches of it.
          stability: development
        - id: run
          value: run
          brief: Each request carries the run id as its cache key, so no other run reads what this one cached.
          stability: development
    stability: development
    brief: Which runs share what the provider caches of the run's requests.
    note: >
      Justification: the conventions count cached tokens and say nothing of who may share a
      cache. A run that reads what another wrote costs less and answers sooner than it would
      have alone, so its cost and its first-call latency depend on the scope.
    examples: [shared, run]
