[package]
name = "lablet-run"
description = "RunService (the loop) and its secondary ports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
lablet-model.workspace = true
lablet-policy.workspace = true
opentelemetry.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The loop is async, so its tests need a runtime; dev-dependencies aren't held
# to the ring rules, and no production code here touches tokio.
tokio = { workspace = true, features = ["macros", "rt"] }
# The tests read a record back from the SDK's in-memory exporter, which is behind
# `testing`; the application ring may hold the SDK in tests alone. The feature also
# turns on the SDK's `metrics` and `tokio/sync` in every test build of the workspace.
opentelemetry_sdk = { workspace = true, features = ["testing"] }
