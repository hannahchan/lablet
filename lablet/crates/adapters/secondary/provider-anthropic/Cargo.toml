[package]
name = "lablet-provider-anthropic"
description = "ModelProvider over the Anthropic Messages API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
lablet-model.workspace = true
lablet-run.workspace = true
opentelemetry.workspace = true
percent-encoding.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
lablet-test-support.workspace = true
# The in-memory exporter the context tests read each attempt's chat span from, and the W3C
# propagators the headers are injected through.
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["test-util"] }
wiremock.workspace = true

[[test]]
name = "it"
path = "tests/it/main.rs"
