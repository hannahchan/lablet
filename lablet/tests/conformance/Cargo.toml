[package]
name = "lablet-conformance"
description = "The shared ToolExecutor conformance cases, the OTLP/JSON reader, a host's in-memory providers and the in-process OTLP receiver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
axum.workspace = true
flate2.workspace = true
lablet-model.workspace = true
lablet-run.workspace = true
opentelemetry-proto = { workspace = true, features = ["gen-tonic"] }
# A host's providers over the SDK's in-memory exporters, which are behind `testing`, for the
# library's tests to hand in and read back.
opentelemetry_sdk = { workspace = true, features = ["testing"] }
prost.workspace = true
rcgen.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tonic = { workspace = true, features = ["server", "router", "tls-aws-lc"] }

[dev-dependencies]
lablet-test-support.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
