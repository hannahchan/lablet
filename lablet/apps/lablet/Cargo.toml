[package]
name = "lablet"
description = "A lightweight, instrumented agent loop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
clap.workspace = true
humantime.workspace = true
lablet-documents.workspace = true
lablet-model.workspace = true
lablet-policy.workspace = true
lablet-provider-fake.workspace = true
lablet-run.workspace = true
lablet-tools-builtin.workspace = true
lablet-transcript-json.workspace = true
opentelemetry.workspace = true
opentelemetry-http.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry-proto.workspace = true
opentelemetry_sdk.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
schemars.workspace = true
secrecy.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ulid.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true, features = ["process"] }

[dev-dependencies]
lablet-conformance.workspace = true
lablet-test-support.workspace = true
nix.workspace = true
# A host's own tracer in the tests, over the SDK's in-memory exporter, which is behind
# `testing`, so a test can open a span of the host's and read what reached it.
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["test-util"] }

[[test]]
name = "it"
path = "tests/it/main.rs"
