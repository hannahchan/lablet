[package]
name = "lablet"
description = "A lightweight, instrumented agent loop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
lablet-config.workspace = true
lablet-documents.workspace = true
lablet-model.workspace = true
lablet-otel-env.workspace = true
lablet-prepare.workspace = true
lablet-provider-wiring.workspace = true
lablet-run.workspace = true
lablet-run-request.workspace = true
lablet-tools-wiring.workspace = true
lablet-transcript-json.workspace = true
opentelemetry.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
lablet-conformance.workspace = true
lablet-test-support.workspace = true
# The OTLP exporters the `traced_run` example's host sends its runs through.
opentelemetry-otlp.workspace = true
# A host's own providers in the tests and the examples, the tests' over the SDK's in-memory
# exporters, which are behind `testing`.
opentelemetry_sdk = { workspace = true, features = ["testing"] }
serde-saphyr.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true

[[test]]
name = "it"
path = "tests/it/main.rs"

# The one test that sets OpenTelemetry's globals, in a binary of its own so no
# other test sees them.
[[test]]
name = "globals"
path = "tests/globals.rs"
