[package]
name = "lablet"
description = "A lightweight, instrumented agent loop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
lablet-config.workspace = true
lablet-documents.workspace = true
lablet-model.workspace = true
lablet-otel-sdk.workspace = true
lablet-prepare.workspace = true
lablet-provider-wiring.workspace = true
lablet-run.workspace = true
lablet-run-request.workspace = true
lablet-tools-wiring.workspace = true
lablet-transcript-json.workspace = true
opentelemetry.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
lablet-conformance.workspace = true
# The telemetry's exporter hook, which the test of a run's end hands an exporter to.
lablet-otel-sdk = { workspace = true, features = ["testing"] }
lablet-test-support.workspace = true
# A host's own tracer in the tests, over the SDK's in-memory exporter, which is behind
# `testing`, so a test can open a span of the host's and read what reached it.
opentelemetry_sdk = { workspace = true, features = ["testing"] }
serde-saphyr.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true

[[test]]
name = "it"
path = "tests/it/main.rs"
