[package]
name = "lablet-otel-sdk"
description = "The OpenTelemetry SDK as lablet configures it, which both roots build until the CLI root holds it alone"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

# `testing` lets a test of another crate hand the telemetry an exporter of
# its own, as this crate's tests do; nothing else turns it on.
[features]
testing = []

[dependencies]
async-trait.workspace = true
lablet-config.workspace = true
lablet-otel-env.workspace = true
lablet-run.workspace = true
opentelemetry.workspace = true
opentelemetry-http.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry-proto.workspace = true
opentelemetry_sdk.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
secrecy.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# The canary of the global propagator builds a `Lablet`, the build it's about.
lablet.workspace = true
lablet-conformance.workspace = true
lablet-test-support.workspace = true
