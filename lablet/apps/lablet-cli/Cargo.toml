[package]
name = "lablet-cli"
# The command's `--help` opens with this line, so it stays the library's.
description = "A lightweight, instrumented agent loop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

# The command keeps its name, `lablet`, from a package of its own. Not
# documented: rustdoc would write it where the library root's `lablet` goes.
[[bin]]
name = "lablet"
path = "src/main.rs"
doc = false

[dependencies]
async-trait.workspace = true
clap.workspace = true
lablet-config.workspace = true
lablet-documents.workspace = true
lablet-model.workspace = true
lablet-otel-sdk.workspace = true
lablet-prepare.workspace = true
lablet-provider-wiring.workspace = true
lablet-run.workspace = true
lablet-run-request.workspace = true
lablet-tools-wiring.workspace = true
lablet-transcript-json.workspace = true
opentelemetry.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true, features = ["process"] }

[dev-dependencies]
# The parity test runs the library beside the command on one config, and the
# golden comparison runs the library from this package's directory, which the
# starter's paths and so its config digest are relative to.
lablet.workspace = true
lablet-conformance.workspace = true
lablet-provider-fake.workspace = true
lablet-test-support.workspace = true
nix.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[[test]]
name = "it"
path = "tests/it/main.rs"
