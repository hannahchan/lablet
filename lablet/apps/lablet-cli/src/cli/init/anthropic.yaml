# A starter config for lablet, whose model is reached through Anthropic's
# Messages API. The key is read from the variable api_key names, never
# written here. A setting left out has its default, a relative path starts
# at this file's directory, and lablet's examples README lists the models.
model:
  provider: anthropic
  name: claude-opus-5-5
  api_key: ${ANTHROPIC_API_KEY}
prompt:
  system: You are a careful coding agent. Say what you did, and why.
# To let the model work on files, name the directory it works in, which may
# not hold this file, and the tools it may use there:
# tools:
#   builtin:
#     root: work
#     enabled: [bash, read_file, write_file]
