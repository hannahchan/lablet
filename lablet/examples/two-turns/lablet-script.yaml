# What the scripted model answers: each entry answers one provider call, in
# order, whatever it was asked. Each waits as a model would before it
# answers, so the run's chat spans have a length to look at in Jaeger.
- response:
    content:
      - text: I'll read the notes first.
      - tool_use: { id: call_1, name: read_file, input: { json: { path: notes.md } } }
    finish: tool_use
    latency: 300ms
    usage: { input_tokens: 140, output_tokens: 24 }
- response:
    content:
      - text: The notes say the parser is off by one at the end of a line.
    finish: end_turn
    latency: 150ms
    usage: { input_tokens: 210, output_tokens: 18 }
