# What the gates check lives in xtask; this file and floors.yml only set up a
# clean runner and run them, so another CI provider is a rewrite of the two.
name: CI

# No pull_request trigger: work is pushed to a branch and `main` is
# fast-forwarded, once the branch is green when the landing merges parallel
# streams or closes a phase (CLAUDE.md).
on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a branch supersedes the run in progress. Not on `main`: the
# changelog gate judges each push over its own range and only `main` saves the
# build cache, so the sha gives every `main` run a group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'branch' }}
  cancel-in-progress: true

jobs:
  gate:
    # Line and region coverage run beside `ci`, so neither waits for the other
    # and one failing does not cancel the other. Mutation testing and branch
    # coverage aren't here: they run daily and on demand, in floors.yml.
    name: ${{ matrix.task }}
    strategy:
      fail-fast: false
      matrix:
        task: [ci, coverage]
        # Not `ubuntu-latest`: it moves between images, and the build cache
        # would restore artefacts linked against another image's libraries.
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Incremental artefacts are useless on a fresh runner and bloat the cache.
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      # Actions are pinned by commit because a tag can be moved; the trailing
      # comment names the tag. Full history: the changelog gate diffs against a
      # base commit a shallow clone lacks. No persisted credentials, and the
      # token mise exports is blanked after it: nothing later talks to the
      # remote.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # xtask's default changelog base is the merge-base with origin/main. On
      # `main` that is the pushed commit itself, so there the base is what
      # `main` pointed at before the push. `before` is all zeros on a first
      # push and may be gone after a force push; then the variable stays unset.
      # It goes through `env` so the script never interpolates event data.
      - name: Select the changelog base
        if: matrix.task == 'ci' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ ! "$BEFORE" =~ ^0+$ ]] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "LABLET_CHANGELOG_BASE=$BEFORE" >> "$GITHUB_ENV"
          fi

      # Before mise, whose cargo backend needs a working cargo.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      # After the toolchain: the cache key includes the rustc version. Only
      # `main` saves, so branch caches cannot evict main's. The automatic key
      # tells neither matrix legs nor images apart, hence the explicit one.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            lablet
            xtask
          key: ${{ matrix.task }}-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The mise version that wrote mise.lock; bump the two together.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.7
          cache: true

      # mise-action exports the job's token to every later step. mise has
      # installed the pins by now and needs no token after that.
      - name: Keep the token from the build
        run: echo "MISE_GITHUB_TOKEN=" >> "$GITHUB_ENV"

      - name: cargo xtask ${{ matrix.task }}
        run: cargo xtask ${{ matrix.task }}

  live-check:
    # The telemetry contract against what lablet emits: `weaver registry
    # live-check` listens over OTLP, lablet runs its fake-provider configs
    # against it, and a violation in the report fails the job. It builds the
    # binary and binds ports, so it is a job of its own and not a gate step.
    # The registry and its dependencies are vendored, so it needs no network.
    name: weaver live-check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      # The same setup as `gate`, without the full history: no changelog
      # gate runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            lablet
            xtask
          key: live-check-ubuntu-24.04
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.7
          cache: true

      - name: Keep the token from the build
        run: echo "MISE_GITHUB_TOKEN=" >> "$GITHUB_ENV"

      - name: cargo xtask weaver live-check
        run: cargo xtask weaver live-check
