# Whether lablet/telemetry/deps still holds upstream's files at the pinned
# commits. Apart from CI: it needs the network, which no gate does, and a
# failure here is about the tree, not about the push that happened to meet it.
name: Vendored files

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: weaver vendor --check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Pinned by commit, as in ci.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      # No mise: the vendor script needs git alone.
      - name: cargo xtask weaver vendor --check
        run: cargo xtask weaver vendor --check
