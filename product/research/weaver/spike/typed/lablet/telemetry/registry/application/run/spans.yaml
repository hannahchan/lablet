file_format: definition/2

spans:
  - type: lablet.chat
    requirement_level: recommended
    kind: client
    stability: development
    brief: One attempt of a provider call, a child of the root span. Follows the GenAI inference span.
    note: >
      Every attempt has a span, a failed one included, which starts when the attempt began and
      lasts as long as the attempt took. A failed attempt's span carries the usage the provider
      reported for it, when it reported any. An attempt that was in flight when the run was
      cancelled was dropped there, and its span ends then, with an `error.type` of `cancelled`
      and no usage.
    name:
      note: "`chat {gen_ai.request.model}`"
    attributes:
      - ref_group: attributes.lablet.join
      - ref: gen_ai.operation.name
        brief: Always `chat`.
        requirement_level: required
      - ref: gen_ai.provider.name
        requirement_level: required
      - ref: gen_ai.request.model
        requirement_level: required
      - ref: gen_ai.request.max_tokens
        requirement_level: required
      - ref: gen_ai.request.temperature
        requirement_level:
          conditionally_required: If `model.temperature` is set.
      - ref: gen_ai.request.seed
        requirement_level:
          conditionally_required: If `model.seed` is set.
      - ref: gen_ai.request.reasoning.level
        requirement_level:
          conditionally_required: If `model.effort` is set.
      - ref: server.address
        requirement_level:
          conditionally_required: If the provider is reached over the network.
      - ref: server.port
        requirement_level:
          conditionally_required: If `server.address` is set.
      - ref: gen_ai.response.id
        requirement_level:
          conditionally_required: If the call succeeded and the provider returned one.
      - ref: gen_ai.response.model
        requirement_level:
          conditionally_required: If the call succeeded and the provider returned one.
      - ref: gen_ai.response.finish_reasons
        requirement_level:
          conditionally_required: If the call succeeded.
      - ref: gen_ai.usage.input_tokens
        requirement_level:
          conditionally_required: If the call succeeded, or failed and reported what it used.
      - ref: gen_ai.usage.output_tokens
        requirement_level:
          conditionally_required: If the call succeeded, or failed and reported what it used.
      - ref: gen_ai.usage.reasoning.output_tokens
        requirement_level:
          conditionally_required: If the provider reported the count for the attempt.
      - ref: gen_ai.usage.cache_read.input_tokens
        requirement_level:
          conditionally_required: If the provider reported the count for the attempt.
      - ref: gen_ai.usage.cache_write.input_tokens
        requirement_level:
          conditionally_required: If the provider reported the count for the attempt.
      - ref: error.type
        brief: >
          The class of provider error: `retryable`, `context_exhausted`, `auth`, `fatal`, or
          `malformed`; or `cancelled` when the run was cancelled while the attempt was in flight.
        requirement_level:
          conditionally_required: If the call failed or was cancelled.
      - ref: lablet.turn
        requirement_level: required
      - ref: lablet.attempt
        requirement_level: required
      - ref: lablet.chat.purpose
        requirement_level: required
      - ref: lablet.request.bytes
        requirement_level: required

  - type: lablet.execute_tool
    requirement_level: recommended
    kind: internal
    stability: development
    brief: One tool call, a child of the root span. Follows the GenAI `execute_tool` span.
    note: >
      A call to an MCP tool is this one span carrying the `mcp.*` attributes too, not a nested
      MCP client span, as the MCP conventions ask of an instrumentation that already traces the
      tool call.
    name:
      note: "`execute_tool {gen_ai.tool.name}`"
    attributes:
      - ref_group: attributes.lablet.join
      - ref: gen_ai.operation.name
        brief: Always `execute_tool`.
        requirement_level: required
      - ref: gen_ai.tool.name
        requirement_level: required
      - ref: gen_ai.tool.call.id
        requirement_level: required
      - ref: gen_ai.tool.type
        brief: "`function` for a built-in tool, `extension` for an MCP tool."
        requirement_level:
          conditionally_required: If the tool is one the run offered to the model.
      - ref: gen_ai.tool.description
        requirement_level:
          conditionally_required: If the tool is one the run offered to the model.
      - ref: error.type
        brief: >
          How the call failed, which is its `lablet.tool.status`: `tool_error` when the tool ran
          and reported an error, `timeout` or `failed` when the executor did, `cancelled` when the
          run was cancelled while the call ran, and `unknown`, `malformed_input`, or `rejected`
          when the loop answered the call itself.
        requirement_level:
          conditionally_required: If the call's status isn't `ok`.
      - ref: lablet.turn
        requirement_level: required
      - ref: lablet.tool.status
        requirement_level: required
      - ref: lablet.tool.source
        requirement_level:
          conditionally_required: If the tool is one the run offered to the model.
      - ref: lablet.tool.input.bytes
        requirement_level: required
      - ref: lablet.tool.output.bytes
        requirement_level: required
      - ref: lablet.tool.output.truncated
        requirement_level: required
      - ref: lablet.tool.output.original_bytes
        requirement_level:
          conditionally_required: If the output cap cut the output short.
      - ref: lablet.tool.is_error
        requirement_level: required
      - ref: mcp.method.name
        requirement_level:
          conditionally_required: If the tool is served over MCP and the call wasn't cancelled.
      - ref: mcp.session.id
        requirement_level:
          conditionally_required: If the tool is served over MCP, the call wasn't cancelled, and the transport has a session.
      - ref: mcp.protocol.version
        requirement_level:
          conditionally_required: If the tool is served over MCP, the call wasn't cancelled, and the version was negotiated.
      - ref: jsonrpc.request.id
        requirement_level:
          conditionally_required: If the tool is served over MCP, the call wasn't cancelled, and the request had an id.
      - ref: rpc.response.status_code
        brief: The error code of the JSON-RPC response.
        requirement_level:
          conditionally_required: If the MCP response carried a JSON-RPC error.
      - ref: network.transport
        brief: "`pipe` for a stdio MCP server, `tcp` for an HTTP one."
        requirement_level:
          conditionally_required: If the tool is served over MCP and the call wasn't cancelled.
