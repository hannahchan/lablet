StylesPath = .vale/styles
# The gate passes --minAlertLevel error itself; an editor shows everything.
MinAlertLevel = suggestion
Vocab = Lablet

# A release URL rather than the bare name, so `vale sync` fetches a fixed version.
Packages = https://github.com/vale-cli/Microsoft/releases/download/v0.15.1/Microsoft.zip

[*.md]
BasedOnStyles = Vale, Microsoft

# Inventories of other projects' identifiers, quoted as found.
[product/research/**]
BasedOnStyles =
